name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Create missing .env and .env.example
        run: |
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
        
      - name: Create missing Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        
      - name: Setup Gradle (Cache Disabled)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true
        
      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaperTrail-APK
          path: app/build/outputs/apk/debug/app-debug.apk